name: Readonly devnet SDK sequence probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'peterpeter228/stonklaunch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies without secrets
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Trace at most 25 readonly RPC requests, never sign or submit
        run: node --import tsx scripts/devnet-sdk-readonly-probe.ts
