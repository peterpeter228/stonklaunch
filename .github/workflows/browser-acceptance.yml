name: Secret-free rendered browser acceptance
run-name: browser-demo:${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-demo-acceptance
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'peterpeter228/stonklaunch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      APP_MODE: demo
      APP_ORIGIN: http://127.0.0.1:3110
      NEXT_TELEMETRY_DISABLED: '1'
      # Non-secret fixtures only; the private-drafts UI test blocks external I/O.
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-public-key-not-a-credential
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Reject environment files and prepare fresh evidence directory
        shell: bash
        run: |
          set -euo pipefail
          if find . -maxdepth 1 -name '.env*' ! -name '.env.example' | grep -q .; then
            echo 'Environment files are forbidden in secret-free browser acceptance.'
            exit 1
          fi
          mkdir -p evidence/browser-acceptance
          printf 'Source: %s\nScope: synthetic DEMO Chromium desktop and 360px; no wallet or chain execution\n' "$GITHUB_SHA" > evidence/browser-acceptance/scope.txt
      - name: Install locked application and test dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node -e "if(require('@playwright/test/package.json').version!=='1.64.1')throw Error('Unexpected Playwright version')"
      - name: Install official Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify public corresponding source matches this checkout
        run: python3 deploy/verify-source-release.py
      - name: Build actual production application in DEMO mode
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee evidence/browser-acceptance/build.log
      - name: Click actual rendered customer journey at both viewport sizes
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --config=e2e/playwright.config.mjs 2>&1 | tee evidence/browser-acceptance/browser.log
      - name: Preserve only secret-free acceptance outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/browser-acceptance/
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false
