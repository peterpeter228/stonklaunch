name: Readonly devnet RPC diagnostics
on:
  workflow_dispatch:
permissions: {}
jobs:
  diagnose:
    if: github.repository == 'peterpeter228/stonklaunch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read fixed devnet RPC without secrets or dependencies
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = 'https://api.devnet.solana.com';
          const genesis = 'EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG';
          const names = new Set(['Error','TypeError','SyntaxError','AbortError','TimeoutError']);
          const codes = new Set(['ECONNRESET','ECONNREFUSED','ETIMEDOUT','ENOTFOUND','EAI_AGAIN','UND_ERR_CONNECT_TIMEOUT','UND_ERR_SOCKET']);
          async function request(method, params, id) {
            const started = Date.now();
            let status = null;
            try {
              const response = await fetch(endpoint, {
                method: 'POST', redirect: 'error', signal: AbortSignal.timeout(10000),
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({jsonrpc: '2.0', id, method, params})
              });
              status = response.status;
              if (!response.ok) {
                console.log(JSON.stringify({method, id, httpStatus: status, durationMs: Date.now()-started, stopped: true}));
                return false;
              }
              const data = await response.json();
              if (data && typeof data === 'object' && Object.hasOwn(data, 'error')) {
                const rpcErrorCode = Number.isSafeInteger(data.error?.code) ? data.error.code : null;
                console.log(JSON.stringify({method, id, httpStatus: status, rpcErrorCode, durationMs: Date.now()-started, stopped: true}));
                return false;
              }
              const envelope = data?.jsonrpc === '2.0' && data.id === id;
              const height = method === 'getBlockHeight' ? data?.result : data?.result?.value?.lastValidBlockHeight;
              const valid = envelope && (method === 'getGenesisHash' ? data.result === genesis : Number.isSafeInteger(height) && height >= 0);
              console.log(JSON.stringify({method, id, httpStatus: status, rpcErrorCode: null, durationMs: Date.now()-started,
                ...(method === 'getGenesisHash' ? {genesisMatches: valid} : {resultHeight: valid ? height : null}), stopped: !valid}));
              return valid;
            } catch (error) {
              const name = names.has(error?.name) ? error.name : 'OtherError';
              const candidate = error?.cause?.code ?? error?.code;
              console.log(JSON.stringify({method, id, httpStatus: status, durationMs: Date.now()-started,
                errorName: name, errorCode: codes.has(candidate) ? candidate : null, stopped: true}));
              return false;
            }
          }
          async function main() {
            const calls = [['getGenesisHash', []], ['getLatestBlockhash', [{commitment:'confirmed'}]],
              ['getBlockHeight', [{commitment:'confirmed'}]], ['getBlockHeight', [{commitment:'confirmed'}]]];
            for (let i=0; i<calls.length; i++) {
              if (i === 3) await new Promise(resolve => setTimeout(resolve, 1000));
              if (!await request(calls[i][0], calls[i][1], i+1)) { process.exitCode=1; return; }
            }
          }
          main();
          NODE
