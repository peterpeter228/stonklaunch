name: Durable devnet creator acceptance
run-name: creator-acceptance:${{ inputs.mode }}:${{ inputs.step }}:${{ inputs.claim_nonce }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare reads only. Execute consumes one precommitted and run-bound public claim.
        type: choice
        options: [prepare, execute]
        default: prepare
      step:
        description: Fixed acceptance order, exactly one execution attempt per step.
        type: choice
        options: [launch, buy, sell, claim-creator]
        default: launch
      source_sha:
        description: Reviewed full source commit, required for execute. Must match the public claim.
        type: string
        default: ''
      claim_nonce:
        description: Unique public claim nonce, required for execute; never a secret.
        type: string
        default: ''
      public_recovery_json:
        description: Prepare only, public mint/pool/signatures. Execute uses the repository ledger exclusively.
        type: string
        default: '{}'
permissions:
  contents: read
concurrency:
  group: durable-devnet-creator-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'peterpeter228/stonklaunch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      RUN_MODE: ${{ inputs.mode }}
      RUN_STEP: ${{ inputs.step }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CLAIM_NONCE: ${{ inputs.claim_nonce }}
      PUBLIC_RECOVERY_JSON: ${{ inputs.public_recovery_json }}
    steps:
      - name: Reject reruns and malformed execution identities before checkout
        if: inputs.mode == 'execute'
        shell: bash
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CLAIM_NONCE" =~ ^[a-zA-Z0-9_-]{16,80}$ ]]
          test "$PUBLIC_RECOVERY_JSON" = '{}'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.mode == 'execute' && inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies without wallet secret
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/verify-dependency.mjs
      - name: Verify public run claim and reviewed workflow before secret exposure
        if: inputs.mode == 'execute'
        env:
          RUN_MODE: gate
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/devnet-durable-runner.ts
      - name: Prepare public acceptance evidence without wallet secret
        if: inputs.mode == 'prepare'
        run: node --import tsx scripts/devnet-durable-runner.ts
      - name: Execute exactly one claimed devnet step
        if: inputs.mode == 'execute'
        env:
          GH_TOKEN: ${{ github.token }}
          STONK_DEVNET_KEYPAIR_JSON: ${{ secrets.STONK_DEVNET_KEYPAIR_JSON }}
        run: node --import tsx scripts/devnet-durable-runner.ts
      - name: Upload only new public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: durable-creator-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/durable-creator/**/*.json
          if-no-files-found: ignore
          retention-days: 90
          include-hidden-files: false
